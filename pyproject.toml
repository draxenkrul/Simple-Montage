[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-montage"
version = "0.1.0"
description = "A minimal Windows video cutter focused on cutting and speed changes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "python-mpv>=1.0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
simple-montage = "simple_montage.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
simple_montage = ["resources/*.png"]
