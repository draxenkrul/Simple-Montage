name: Build Windows app

# Manual only: run it from the Actions tab ("Run workflow") when you want a
# standalone SimpleMontage.exe. It does not run on push.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build, test and package
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Python python

      - name: Upload app
        uses: actions/upload-artifact@v5
        with:
          name: SimpleMontage-windows-x64
          path: dist/SimpleMontage/
          retention-days: 30
