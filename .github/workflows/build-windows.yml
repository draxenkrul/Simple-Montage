name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a release for v* tags

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build, test and package
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Python python

      - name: Upload app
        uses: actions/upload-artifact@v5
        with:
          name: SimpleMontage-windows-x64
          path: dist/SimpleMontage/
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SimpleMontage-windows-x64.zip
